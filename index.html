<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logopopuli.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ea580c" />
    <link rel="apple-touch-icon" href="/logopopuli.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Populi WA" />
    <title>Populi Center – WA Survey Platform</title>
    <script>
      // Tema dipasang SEBELUM gaya apa pun dilukis. Kalau menunggu modul React dimuat,
      // pemakai yang memilih gelap sementara sistemnya terang akan melihat kilatan putih
      // di tiap muat halaman — kecil, tapi persis jenis detail yang membuat aplikasi
      // terasa belum jadi. Sengaja ditulis tanpa modul dan tanpa dependensi.
      try {
        var t = localStorage.getItem("populi.tema");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
